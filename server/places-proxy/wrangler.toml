# Settings for the Cloudflare Worker in worker.js. See README.md in this folder.
name = "spotted-places-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Limit each phone/IP to 60 requests per minute.
# (Cloudflare's rate limit feature. If your Cloudflare dashboard says this setting has changed,
#  follow their current docs: https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/ )
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
