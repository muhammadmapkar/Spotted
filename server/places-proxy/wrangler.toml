# Settings for the Cloudflare Worker in worker.js. See README.md in this folder.
name = "spotted-places-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Limit each phone/IP to 60 requests per minute.
# This is Cloudflare's current "ratelimits" setting (the old [[unsafe.bindings]] way is retired).
# "period" can only be 10 or 60 seconds. "namespace_id" is any number you choose, just keep it unique
# in your Cloudflare account. Docs: https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# Optional shared secret (see README.md). Do NOT write the secret here.
# Set it with:  npx wrangler secret put APP_SHARED_SECRET
# If it is not set, the proxy accepts every request (it still works).
